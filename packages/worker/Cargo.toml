[package]
name = "pully-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
axum = { version = "0.8", default-features = false, features = [ "json", "query" ] }
pulls-review-server = { path = "../../backend" }
tower-service = "0.3"
worker = { version = "0.8", features = [ "http" ] }
anyhow = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
