[package]
name = "pully-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = [ "cdylib" ]

[dependencies]
axum = { version = "0.8", default-features = false, features = [
  "json",
  "query"
] }
pulls-review-server = { path = "../../backend" }
tower-service = "0.3"
worker = { version = "0.8", features = [ "http" ] }
anyhow = "1"
futures-util = "0.3"
send_wrapper = { version = "0.6", features = [ "futures" ] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [ "Request", "RequestInit", "Response" ] }
console_error_panic_hook = "0.1"

# mermaid-rs-renderer 0.3.1 times its layout with std::time::Instant, which panics on
# wasm32-unknown-unknown. The copy in vendor/ is the published crate with those three imports
# switched to web-time; the native server keeps the crate as published.
[patch.crates-io]
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }
