name: Stable server

# The stable server on Cloudflare: the same Worker as staging (packages/worker), deployed as its
# own Worker (`pully-stable`) with its own data, only from a release push whose CI passed and
# that scripts/release-track.mjs admits (docs/RELEASE_TRACK.md). Until the operator sets
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and the PULLY_STABLE_HOST variable, every run
# skips. Setting PULLY_STABLE_HOST moves that host to Cloudflare, so it waits for Tavi's
# go-ahead and the host's Access application (packages/worker/CONTRACTS,
# hosted-server-only-behind-access); the VPS data is copied first with
# packages/worker/scripts/import-vps.mjs (packages/worker/README.md, Stable).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stable
  cancel-in-progress: false

jobs:
  stable:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, linux, x64, pully-linux]
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STABLE_HOST: ${{ vars.PULLY_STABLE_HOST }}
    steps:
      - name: Check the stable setup
        id: setup
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [[ "$STABLE_HOST" =~ ^[a-z0-9.-]+\.[a-z]+$ ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo 'The stable server is not on Cloudflare yet (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, PULLY_STABLE_HOST); nothing was deployed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v7
        if: steps.setup.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'release' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: steps.setup.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.setup.outputs.ready == 'true'
        with:
          node-version: '24'
          cache: pnpm
      - name: Require the exact verified release commit
        if: steps.setup.outputs.ready == 'true'
        run: node scripts/release-track.mjs
      - name: Install the Worker toolchain
        if: steps.setup.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          rustup target add wasm32-unknown-unknown
          cargo install worker-build --version 0.8.7 --locked
      - name: Verify the workspace header boundary
        if: steps.setup.outputs.ready == 'true'
        working-directory: packages/worker
        run: |
          rustc --edition=2021 --test src/request_headers.rs -o "$RUNNER_TEMP/pully-worker-request-headers-test"
          "$RUNNER_TEMP/pully-worker-request-headers-test"
      - name: Deploy the stable server
        if: steps.setup.outputs.ready == 'true'
        working-directory: packages/worker
        run: |
          node scripts/stable-config.mjs "$STABLE_HOST" > wrangler.stable.json
          npx wrangler deploy -c wrangler.stable.json
          echo "Deployed the stable server to https://$STABLE_HOST" >> "$GITHUB_STEP_SUMMARY"
