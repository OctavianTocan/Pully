name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-source:
    runs-on: [self-hosted, linux, x64, pully-linux]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require the exact verified release commit before publication
        run: node scripts/release-track.mjs

  release:
    needs: release-source
    runs-on: [self-hosted, linux, x64, pully-linux]
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Setup JS
        uses: sxzz/workflows/setup-js@main
        with:
          fetch-all: true
          cache: false
      - name: Generate GitHub Changelog
        run: pnpx changelogithub
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: pnpm --filter '!@pulls.review/app' -r run build
      - name: Publish to NPM
        run: pnpm -r publish --access public --no-git-checks
