name: CI

on:
  push:
    branches:
      - main
      - release

  pull_request:
    branches:
      - main
      - release

jobs:
  # Legacy required context retained transparently for connections without admin API access.
  # This is fast integration policy validation, not Android build/release certification.
  android-release:
    runs-on: [self-hosted, linux, x64, pully-linux]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Fast integration policy and publication safeguards
        run: |
          set -e
          for suite in scripts/release-track.test.mjs scripts/release-policy.test.mjs android/scripts/release.test.mjs android/scripts/publish.test.mjs packages/worker/scripts/publish-staging-android.test.mjs packages/worker/scripts/import-vps.test.mjs scripts/pulls-review-update.test.mjs; do
            node "$suite"
          done
      - name: Explain the retained required context
        run: echo 'android-release is the legacy fast integration policy context. Full certification is release-prerequisites plus the release verify jobs.' >> "$GITHUB_STEP_SUMMARY"

  release-prerequisites:
    if: github.base_ref == 'release' || github.ref == 'refs/heads/release'
    runs-on: [self-hosted, linux, x64, pully-linux]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Compare the actual promotion base
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node android/scripts/check-release.mjs --base "$RELEASE_BASE"

  lint:
    runs-on: [self-hosted, linux, x64, pully-linux]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Contracts
        run: pnpm run contracts:check

  typecheck:
    runs-on: [self-hosted, linux, x64, pully-linux]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Build embed
        run: pnpm -F @pulls.review/app run build:embed

      - name: Typecheck
        run: pnpm run typecheck

  android-design:
    runs-on: [self-hosted, linux, x64, pully-linux]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Design checks
        run: pnpm run android:design

      - name: Design check tests
        run: pnpm run android:design:test
