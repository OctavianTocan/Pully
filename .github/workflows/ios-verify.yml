name: iOS verify

on:
  pull_request:
    paths:
      - mobile/**
      - ios/**
      - android/core/**
      - android/app/src/main/res/font/**
      - android/app/src/main/assets/licenses/**
      - android/app/src/main/assets/i18n/**
      - android/build.gradle.kts
      - android/settings.gradle.kts
      - android/gradle/**
      - CONTRACTS
      - .github/workflows/ios-verify.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Ordinary ARM64 hosted runner; this is not the paid -xlarge runner label.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      IOS_RUNTIME_VERSION: 26.4.1
      IOS_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/**/*.gradle.kts
            mobile/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Restore pinned Kotlin Native toolchain
        id: native-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-pully-konan-2.4.21-xcode-26.4.1
      - name: Verify pinned Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          test -d "$DEVELOPER_DIR"
          plutil -lint ios/Pully/Info.plist ios/Pully.xcodeproj/project.pbxproj
      - name: Set up Android command-line tools for the shared Android target
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
      - name: Install the shared target Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Create the pinned iPhone simulator
        id: simulator
        run: |
          pully_runtime_id=$(xcrun simctl list runtimes --json | python3 -c '
          import json, os, sys
          matches = [r["identifier"] for r in json.load(sys.stdin)["runtimes"]
                     if r.get("isAvailable") and r.get("version") == os.environ["IOS_RUNTIME_VERSION"]
                     and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one installed pinned iOS runtime: " + repr(matches))
          print(matches[0])')
          pully_simulator_id=$(xcrun simctl create Pully-CI "$IOS_DEVICE_TYPE" "$pully_runtime_id")
          echo "udid=$pully_simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$pully_simulator_id"
          xcrun simctl bootstatus "$pully_simulator_id" -b
      - name: Test shared domain on JVM and iOS; link Compose framework
        working-directory: mobile
        run: |
          ./gradlew :shared-domain:jvmTest :shared-domain:iosSimulatorArm64Test \
            :shared-ui:linkDebugFrameworkIosSimulatorArm64 \
            -Ppully.iosSimulatorId=${{ steps.simulator.outputs.udid }} --no-daemon
      - name: Build and test the unsigned iOS host
        run: |
          xcodebuild -project ios/Pully.xcodeproj -scheme Pully -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/Pully.xcresult \
            -parallel-testing-enabled NO \
            test CODE_SIGNING_ALLOWED=NO
      - name: Verify original Pully font resources are bundled
        run: |
          python3 ios/scripts/verify-bundled-fonts.py \
            ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Pully.app
      - name: Package the unsigned simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Pully.app \
            ios/build/Pully-simulator.zip
      - name: Export ready-state screenshots from UI tests
        run: |
          xcrun xcresulttool export attachments --path ios/build/Pully.xcresult \
            --output-path ios/build/screenshots
      - name: Retain simulator test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-evidence
          path: |
            ios/build/Pully.xcresult
            ios/build/Pully-simulator.zip
            ios/build/screenshots
            mobile/shared-domain/build/reports/tests
          if-no-files-found: ignore
      - name: Retain the downloaded Native toolchain for compiler iterations
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-pully-konan-2.4.21-xcode-26.4.1
      - name: Delete the test simulator
        if: always() && steps.simulator.outputs.udid != ''
        run: |
          xcrun simctl shutdown '${{ steps.simulator.outputs.udid }}' || true
          xcrun simctl delete '${{ steps.simulator.outputs.udid }}'
