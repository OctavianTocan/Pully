name: iOS verify

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-release-verify:
    # Ordinary ARM64 hosted runner; this is not the paid -xlarge runner label.
    runs-on: macos-26
    # Cold Native compilation plus the required app/UIKit tests needs more than 45 minutes.
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      IOS_RUNTIME_VERSION: 26.4.1
      IOS_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/**/*.gradle.kts
            mobile/gradle.properties
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Restore pinned Kotlin Native toolchain
        id: native-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-pully-konan-2.4.21-xcode-26.4.1
      - name: Verify pinned Apple toolchain
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          test -d "$DEVELOPER_DIR"
          plutil -lint ios/Pully/Info.plist ios/Pully.xcodeproj/project.pbxproj
      - name: Set up Android command-line tools for the shared Android target
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
      - name: Install the shared target Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Create the pinned iPhone simulator
        id: simulator
        run: |
          pully_runtime_id=$(xcrun simctl list runtimes --json | python3 -c '
          import json, os, sys
          matches = [r["identifier"] for r in json.load(sys.stdin)["runtimes"]
                     if r.get("isAvailable") and r.get("version") == os.environ["IOS_RUNTIME_VERSION"]
                     and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one installed pinned iOS runtime: " + repr(matches))
          print(matches[0])')
          pully_simulator_id=$(xcrun simctl create Pully-CI "$IOS_DEVICE_TYPE" "$pully_runtime_id")
          echo "udid=$pully_simulator_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$pully_simulator_id"
          xcrun simctl bootstatus "$pully_simulator_id" -b
      - name: Test native account storage and configuration rules
        run: swift test --package-path ios/NativeServices
      - name: Test native account and Google SDK rules on the iOS simulator
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        working-directory: ios/NativeServices
        run: |
          xcodebuild -quiet -scheme PullyNative \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath ../build/NativeServices \
            -resultBundlePath ../build/NativeServices.xcresult \
            -parallel-testing-enabled NO test CODE_SIGNING_ALLOWED=NO
      - name: Test actual Keychain in an ad-hoc signed simulator app host
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: |
          python3 -B -m unittest discover -s ios/scripts -p 'test_keychain_test_host.py'
          xcodebuild -quiet -project ios/Pully.xcodeproj -scheme PullyNativeKeychain -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath ios/build/KeychainDerivedData \
            -parallel-testing-enabled NO build-for-testing \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          pully_keychain_host=ios/build/KeychainDerivedData/Build/Products/Debug-iphonesimulator/PullyNativeKeychainHost.app
          codesign --verify --strict "$pully_keychain_host"
          codesign --display --entitlements :- "$pully_keychain_host" > ios/build/KeychainHost.entitlements.plist
          python3 ios/scripts/verify-keychain-test-host.py \
            "$pully_keychain_host" ios/build/KeychainHost.entitlements.plist ios/build/KeychainEntitlements
          xcodebuild -quiet -project ios/Pully.xcodeproj -scheme PullyNativeKeychain -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath ios/build/KeychainDerivedData \
            -resultBundlePath ios/build/Keychain.xcresult \
            -parallel-testing-enabled NO test-without-building \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Test actual Darwin RPC transport against loopback HTTP
        id: rpc
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: |
          mkdir -p ios/build
          pully_fixture_dir=$(mktemp -d "$RUNNER_TEMP/pully-rpc-fixture.XXXXXX")
          python3 ios/scripts/rpc-fixture.py --state-dir "$pully_fixture_dir" \
            > ios/build/rpc-fixture.log 2>&1 &
          pully_fixture_pid=$!
          trap 'kill "$pully_fixture_pid" 2>/dev/null || true; wait "$pully_fixture_pid" 2>/dev/null || true' EXIT
          for pully_attempt in $(seq 1 100); do
            test -s "$pully_fixture_dir/url" && break
            kill -0 "$pully_fixture_pid"
            sleep 0.1
          done
          test -s "$pully_fixture_dir/url"
          cd mobile
          ./gradlew :shared-client:iosSimulatorArm64IntegrationTest \
            -Ppully.rpcFixtureUrl="$(cat "$pully_fixture_dir/url")" \
            -Ppully.iosSimulatorId=${{ steps.simulator.outputs.udid }} --no-daemon
      - name: Print actual Darwin RPC assertion failures
        if: ${{ !cancelled() && steps.rpc.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          failures = 0
          for report in sorted(Path('mobile/shared-client/build/test-results').rglob('TEST-*.xml')):
              for case in ET.parse(report).getroot().iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      failures += 1
                      print('::group::' + case.get('classname', '') + '.' + case.get('name', ''))
                      print(failure.get('message', ''))
                      print(failure.text or '')
                      print('::endgroup::')
          if failures == 0:
              raise SystemExit('Darwin RPC task failed without an XML assertion report; inspect its Gradle output.')
          PY
      - name: Test shared domain on JVM and iOS; link Compose framework
        id: shared
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        working-directory: mobile
        run: |
          ./gradlew --continue :shared-domain:jvmTest :shared-domain:iosSimulatorArm64Test \
            :shared-client:jvmTest :shared-client:iosSimulatorArm64Test :shared-ui:iosSimulatorArm64Test \
            :shared-ui:linkDebugFrameworkIosSimulatorArm64 \
            -Ppully.iosSimulatorId=${{ steps.simulator.outputs.udid }} --no-daemon
      - name: Print actual shared test assertions after a failure
        if: ${{ !cancelled() && steps.shared.outcome == 'failure' }}
        run: |
          python3 ios/scripts/print-shared-test-failures.py \
            mobile/shared-domain/build/test-results mobile/shared-client/build/test-results \
            mobile/shared-ui/build/test-results
          python3 -B -m unittest discover -s ios/scripts -p 'test_shared_test_failures.py'
      - name: Build and test the private iOS simulator host
        id: host
        if: ${{ !cancelled() && steps.shared.outcome == 'success' }}
        run: |
          xcodebuild -project ios/Pully.xcodeproj -scheme Pully -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath ios/build/DerivedData \
            build CODE_SIGNING_ALLOWED=NO
          xcodebuild -quiet -project ios/Pully.xcodeproj -scheme Pully -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath ios/build/DerivedData \
            -parallel-testing-enabled NO build-for-testing \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
          pully_app_host=ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Pully.app
          codesign --verify --strict "$pully_app_host"
          codesign --display --entitlements :- "$pully_app_host" > ios/build/PullyHost.entitlements.plist
          python3 ios/scripts/verify-keychain-test-host.py \
            "$pully_app_host" ios/build/PullyHost.entitlements.plist ios/build/PullyEntitlements pully-app
          xcodebuild -quiet -project ios/Pully.xcodeproj -scheme Pully -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath ios/build/DerivedData \
            -resultBundlePath ios/build/Pully.xcresult \
            -parallel-testing-enabled NO test-without-building \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
      - name: Require every actual UIKit test and retain readable evidence
        if: ${{ !cancelled() && steps.simulator.outcome == 'success' }}
        run: |
          python3 -B -m unittest discover -s ios/scripts -p 'test_host_test_results.py'
          python3 ios/scripts/print-host-test-results.py ios/build/Pully.xcresult ios/build/host-test-evidence
      - name: Verify original Pully fonts and canonical locales are bundled
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        run: |
          python3 ios/scripts/verify-bundled-fonts.py \
            ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Pully.app
      - name: Package the private simulator app
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            ios/build/DerivedData/Build/Products/Debug-iphonesimulator/Pully.app \
            ios/build/Pully-simulator.zip
      - name: Export UI test attachments, including failures
        if: always()
        run: |
          if test -d ios/build/Pully.xcresult; then
            xcrun xcresulttool export attachments --path ios/build/Pully.xcresult \
              --output-path ios/build/screenshots
          fi
      - name: Print actual host test failures and accessibility evidence
        if: ${{ !cancelled() && steps.host.outcome == 'failure' }}
        run: |
          if test -d ios/build/Pully.xcresult; then
            mkdir -p ios/build/diagnostics
            xcrun xcresulttool get test-results summary --path ios/build/Pully.xcresult \
              > ios/build/diagnostics/host-test-summary.json
            cat ios/build/diagnostics/host-test-summary.json
          fi
          python3 - <<'PY'
          from pathlib import Path

          for report in sorted(Path('ios/build/screenshots').rglob('*.txt'))[:12]:
              print('::group::' + report.name)
              print(report.read_text(errors='replace')[:24000])
              print('::endgroup::')
          PY
      - name: Capture simulator screenshot and app diagnostics
        if: failure() && steps.simulator.outputs.udid != ''
        run: |
          mkdir -p ios/build/diagnostics
          xcrun simctl io '${{ steps.simulator.outputs.udid }}' screenshot \
            ios/build/diagnostics/failure.png || true
          xcrun simctl spawn '${{ steps.simulator.outputs.udid }}' log show \
            --last 5m --style compact --predicate 'process == "Pully"' \
            > ios/build/diagnostics/pully.log 2>&1 || true
      - name: Retain simulator test evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-simulator-evidence
          path: |
            ios/build/Pully.xcresult
            ios/build/host-test-evidence
            ios/build/NativeServices.xcresult
            ios/build/Keychain.xcresult
            ios/build/KeychainHost.entitlements.plist
            ios/build/KeychainEntitlements
            ios/build/PullyHost.entitlements.plist
            ios/build/PullyEntitlements
            ios/build/Pully-simulator.zip
            ios/build/screenshots
            ios/build/diagnostics
            ios/build/rpc-fixture.log
            mobile/shared-domain/build/reports/tests
            mobile/shared-client/build/reports/tests
            mobile/shared-client/build/test-results
            mobile/shared-ui/build/reports/tests
            mobile/shared-ui/build/test-results
          if-no-files-found: ignore
      - name: Retain the downloaded Native toolchain for compiler iterations
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-${{ runner.arch }}-pully-konan-2.4.21-xcode-26.4.1
      - name: Delete the test simulator
        if: always() && steps.simulator.outputs.udid != ''
        run: |
          xcrun simctl shutdown '${{ steps.simulator.outputs.udid }}' || true
          xcrun simctl delete '${{ steps.simulator.outputs.udid }}'
