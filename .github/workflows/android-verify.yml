name: Android verify

on:
  pull_request:
    paths:
      - android/**
      - CONTRACTS
      - .github/workflows/android-verify.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the project Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Compile and run JVM tests
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --no-daemon
